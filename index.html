
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Horn Maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/higuma/ogg-vorbis-encoder-js@master/lib/OggVorbisEncoder.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f5f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:760px;margin:0 auto}
header{margin-bottom:25px}
header h1{margin:0;font-size:27px}
header p{color:#777;margin-top:7px}
.section{background:white;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 2px 8px #00000008}
.section h2{margin:0 0 18px;font-size:19px}
.horn-card{border:1px solid #e2e4e8;border-radius:12px;padding:16px;margin-bottom:14px;background:#fff}
.horn-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.horn-title{font-size:17px;font-weight:700}
.field{margin-bottom:15px}
.field label.field-label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:#555}
input[type="text"],input[type="number"]{width:100%;padding:12px;border:1px solid #d9dce2;border-radius:8px;font-size:15px;background:white;color:#222}
input:focus{outline:none;border-color:#4285f4}
.file-select{width:100%;min-height:100px;border:2px dashed #cbd0d8;border-radius:10px;background:#fafbfc;color:#555;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;font-size:14px;font-weight:400}
.file-info{margin-top:8px;font-size:13px;color:#777;overflow-wrap:anywhere}
button{border:none;border-radius:9px;padding:13px 17px;font-size:14px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.add{width:100%;background:#edf3ff;color:#2463c7;margin-top:5px}
.remove{background:#fff0f0;color:#d33;padding:8px 13px}
.generate{width:100%;background:#2463d4;color:white;font-size:16px;padding:16px}
.status{margin-top:15px;color:#555;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.progress{height:7px;background:#e8eaf0;border-radius:10px;margin-top:12px;overflow:hidden}
.progress-bar{width:0%;height:100%;background:#3478e5;transition:width .2s}
.note{font-size:12px;line-height:1.7;color:#777;margin-top:12px}
.fixed-info{padding:12px;background:#f2f6ff;border-radius:9px;color:#315fa8;font-size:13px;margin-bottom:16px}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Music Horn Maker</h1>
<p>カスタムミュージックホーンを作成</p>
</header>

<div class="section">
<h2>ホーン設定</h2>
<div class="fixed-info">音源の分割間隔：0.2秒（固定）<br>最後の余り部分もそのまま保存されるよ。</div>
<div id="hornList"></div>
<button class="add" id="addHorn" type="button">＋ ホーンを追加</button>
</div>

<div class="section">
<h2>アドオン生成</h2>
<button class="generate" id="generateBtn" type="button">mcaddonを生成</button>
<div class="progress"><div class="progress-bar" id="bar"></div></div>
<div class="status" id="status">準備完了</div>
<div class="note">音源はOGG Vorbis形式に変換され、0.2秒間隔で分割されるよ。</div>
</div>
</div>

<script>
const INTERVAL=0.2;
const $=id=>document.getElementById(id);

function setStatus(message){
$("status").textContent=message;
}

function setProgress(value){
$("bar").style.width=Math.max(0,Math.min(100,value))+"%";
}

function uuid(){
return crypto.randomUUID();
}

function versionArray(value){
return value.split(".").map(v=>parseInt(v,10)||0);
}

function updateHornNumbers(){
document.querySelectorAll(".horn-card").forEach((card,index)=>{
card.querySelector(".horn-title").textContent=`ホーン ${index+1}`;
});
}

function createHorn(){
const number=document.querySelectorAll(".horn-card").length+1;
const card=document.createElement("section");
card.className="horn-card";

card.innerHTML=`
<div class="horn-head">
<div class="horn-title">ホーン ${number}</div>
<button type="button" class="remove">削除</button>
</div>
<div class="field">
<label class="field-label">ホーンID</label>
<input type="text" class="horn-id" value="custom_horn_${number}" placeholder="custom_horn_1">
</div>
<div class="field">
<label class="field-label">ホーン名</label>
<input type="text" class="horn-name" value="カスタムホーン ${number}" placeholder="ホーン名">
</div>
<div class="field">
<label class="field-label">音源ファイル</label>
<button type="button" class="file-select">音源ファイルを選択<br>タップしてファイルを選ぶ</button>
<input type="file" class="horn-audio hidden-file">
<div class="file-info">ファイル未選択</div>
</div>
<div class="field">
<label class="field-label">音量</label>
<input type="number" class="horn-volume" value="1" min="0" max="16" step="0.1">
</div>
`;

const audioInput=card.querySelector(".horn-audio");
const fileButton=card.querySelector(".file-select");

fileButton.addEventListener("click",()=>audioInput.click());

audioInput.addEventListener("change",()=>{
const file=audioInput.files&&audioInput.files[0];
card.querySelector(".file-info").textContent=file?file.name:"ファイル未選択";
fileButton.textContent=file?"音源を変更する":"音源ファイルを選択";
});

card.querySelector(".remove").addEventListener("click",()=>{
card.remove();
updateHornNumbers();
});

$("hornList").appendChild(card);
updateHornNumbers();
}

function readHorns(){
return [...document.querySelectorAll(".horn-card")].map(card=>({
id:card.querySelector(".horn-id").value.trim(),
name:card.querySelector(".horn-name").value.trim(),
file:card.querySelector(".horn-audio").files[0],
volume:Number(card.querySelector(".horn-volume").value)
}));
}

function validate(horns){
if(horns.length===0)throw new Error("ホーンを1つ以上追加してね");

const ids=new Set();

const reservedIds=[
"jr_east_mh",
"jr_west_local_line_mh",
"jr_west_limited_express_mh",
"odakyu_romancecar_mh",
"keisei_skyliner_mh",
"saphir_odori_mh"
];

for(let i=0;i<horns.length;i++){
const horn=horns[i];

if(!horn.id)throw new Error(`ホーン ${i+1} のIDを入力してね`);
if(!/^[a-z0-9_]+$/.test(horn.id))throw new Error(`ホーン ${i+1} のIDは半角小文字・数字・アンダーバーだけ使用できるよ`);
if(ids.has(horn.id))throw new Error(`ホーンID「${horn.id}」が重複しているよ`);
if(reservedIds.includes(horn.id))throw new Error(`ホーンID「${horn.id}」は内蔵ホーンで使用されているよ`);
ids.add(horn.id);

if(!horn.name)throw new Error(`ホーン ${i+1} の名前を入力してね`);
if(horn.name.length>64)throw new Error(`ホーン ${i+1} の名前は64文字以内にしてね`);
if(!horn.file)throw new Error(`ホーン ${i+1} の音源ファイルを選択してね`);
if(!Number.isFinite(horn.volume)||horn.volume<0||horn.volume>16)throw new Error(`ホーン ${i+1} の音量は0〜16で入力してね`);
}
}

function createBehaviorManifest(name,description,version,engine,bpUuid,rpUuid){
const manifest={
format_version:2,
header:{
name:name,
description:description,
uuid:bpUuid,
version:versionArray(version),
min_engine_version:versionArray(engine)
},
modules:[
{
description:description,
type:"data",
uuid:uuid(),
version:versionArray(version)
},
{
description:"Script",
type:"script",
language:"javascript",
uuid:uuid(),
version:versionArray(version),
entry:"scripts/main.js"
}
],
dependencies:[
{
module_name:"@minecraft/server",
version:"2.7.0"
}
]
};

if(rpUuid){
manifest.dependencies.unshift({
uuid:rpUuid,
version:versionArray(version)
});
}

return manifest;
}

function createResourceManifest(name,description,version,engine,rpUuid,bpUuid){
const manifest={
format_version:2,
header:{
name:name,
description:description,
uuid:rpUuid,
version:versionArray(version),
min_engine_version:versionArray(engine)
},
modules:[
{
description:"Resources",
type:"resources",
uuid:uuid(),
version:versionArray(version)
}
]
};

if(bpUuid){
manifest.dependencies=[
{
uuid:bpUuid,
version:versionArray(version)
}
];
}

return manifest;
}

async function convertHorn(horn,index,total){
const AudioContextClass=window.AudioContext||window.webkitAudioContext;

if(!AudioContextClass){
throw new Error("このブラウザは音声読み込みに対応していないよ");
}

const audioContext=new AudioContextClass();

try{
const fileData=await horn.file.arrayBuffer();
let audioBuffer;

try{
audioBuffer=await audioContext.decodeAudioData(fileData);
}catch(error){
throw new Error(`${horn.name} の音源を読み込めなかったよ。Safariが対応している音声形式か確認してね。`);
}

const duration=audioBuffer.duration;
const sampleRate=audioBuffer.sampleRate;
const channels=audioBuffer.numberOfChannels;
const segmentCount=Math.ceil(duration/INTERVAL);

if(segmentCount<1)throw new Error(`${horn.name} の音声が空だよ`);
if(channels>2)throw new Error(`${horn.name} は3チャンネル以上の音源に対応していないよ`);

const segments=[];

for(let i=0;i<segmentCount;i++){
const startSample=Math.floor(i*INTERVAL*sampleRate);
const endSample=Math.min(
audioBuffer.length,
Math.round(Math.min((i+1)*INTERVAL,duration)*sampleRate)
);

if(endSample<=startSample)continue;

const channelData=[];

for(let channel=0;channel<channels;channel++){
channelData.push(audioBuffer.getChannelData(channel).slice(startSample,endSample));
}

let encoder;

try{
encoder=new OggVorbisEncoder(sampleRate,channels,0.5);
encoder.encode(channelData);

const blob=encoder.finish("audio/ogg");
const data=new Uint8Array(await blob.arrayBuffer());

if(data.length===0)throw new Error("変換後のデータが空だよ");

segments.push({
hornId:horn.id,
index:i+1,
fileName:`${horn.id}_${i+1}.ogg`,
data
});
}catch(error){
if(encoder){
try{encoder.cancel()}catch(e){}
}
throw new Error(`${horn.name} のOGG変換に失敗したよ: ${error.message||error}`);
}

const progress=((index+(i+1)/segmentCount)/total)*80;
setProgress(progress);
setStatus(`${horn.name} を変換中... ${i+1}/${segmentCount}`);
await new Promise(resolve=>setTimeout(resolve,0));
}

return segments;
}finally{
await audioContext.close();
}
}

async function generate(){
const button=$("generateBtn");
if(button.disabled)return;

button.disabled=true;
$("addHorn").disabled=true;

try{
const horns=readHorns();
validate(horns);

if(typeof OggVorbisEncoder==="undefined"){
throw new Error("OGG変換エンジンを読み込めなかったよ。ページを再読み込みしてね。");
}

const zip=new JSZip();

const bpUuid=uuid();
const rpUuid=uuid();

const packName="Music Horn Maker";
const description="Music Horn Makerで生成されたカスタムミュージックホーン";
const version="1.0.0";
const engine="1.26.0";

const rp=zip.folder("Music Horn Maker RP");
const bp=zip.folder("Music Horn Maker BP");

const soundDefinitions={};
const soundFiles=[];
const registrationData=[];

for(let i=0;i<horns.length;i++){
const horn=horns[i];
const segments=await convertHorn(horn,i,horns.length);

registrationData.push({
id:horn.id,
name:horn.name,
count:segments.length
});

for(const segment of segments){
const soundId=`${horn.id}_${segment.index}`;

soundDefinitions[soundId]={
category:"neutral",
sounds:[
{
name:`sounds/${horn.id}/${segment.fileName.replace(/\.ogg$/,"")}`,
volume:horn.volume
}
]
};

soundFiles.push(segment);
}
}

setStatus("リソースパックを作成中...");
setProgress(85);

const rpManifest=createResourceManifest(
packName+" RP",
description,
version,
engine,
rpUuid,
bpUuid
);

rp.file("manifest.json",JSON.stringify(rpManifest,null,2));

rp.file("sounds/sound_definitions.json",JSON.stringify({
format_version:"1.20.20",
sound_definitions:soundDefinitions
},null,2));

for(const segment of soundFiles){
rp.file(`sounds/${segment.hornId}/${segment.fileName}`,segment.data);
}

setStatus("ビヘイビアーパックを作成中...");
setProgress(90);

const bpManifest=createBehaviorManifest(
packName+" BP",
description,
version,
engine,
bpUuid,
rpUuid
);

bp.file("manifest.json",JSON.stringify(bpManifest,null,2));

const mainJs=`
import { system } from "@minecraft/server";

const HORNS = ${JSON.stringify(registrationData,null,4)};
const EVENT_ID = "hiro:music_horn_register";

function registerHorns() {
    for (const horn of HORNS) {
        try {
            system.sendScriptEvent(
                EVENT_ID,
                JSON.stringify(horn)
            );
        } catch (error) {
            console.warn(\`Horn registration error: \${error}\`);
        }
    }
}

system.run(() => {
    registerHorns();
});

system.runInterval(() => {
    registerHorns();
}, 100);
`;

bp.file("scripts/main.js",mainJs);

setStatus("mcaddonを生成中...");
setProgress(95);

const output=await zip.generateAsync({
type:"blob",
compression:"DEFLATE",
compressionOptions:{level:6}
});

const url=URL.createObjectURL(output);
const link=document.createElement("a");
link.href=url;
link.download="Music_Horn_Maker.mcaddon";
document.body.appendChild(link);
link.click();
link.remove();

setTimeout(()=>URL.revokeObjectURL(url),10000);

setProgress(100);
setStatus("生成完了！mcaddonを保存したよ。");

}catch(error){
console.error(error);
setStatus("エラー: "+(error.message||error));
}finally{
button.disabled=false;
$("addHorn").disabled=false;
}
}

$("addHorn").addEventListener("click",createHorn);
$("generateBtn").addEventListener("click",generate);
createHorn();
</script>
</body>
</html>
